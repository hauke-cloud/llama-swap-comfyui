# Minimal runnable example. `docker compose up` after adjusting the volumes.
services:
  llama-swap-comfyui:
    image: ghcr.io/hauke-cloud/llama-swap-comfyui:cuda
    ports:
      - "8080:8080"
    volumes:
      # GGUF models for llama.cpp
      - ./models:/models
      # ComfyUI's models, custom_nodes, input, output and user directories
      - ./comfyui:/data/comfyui
      # Strata's model files, presets, run settings and keys
      - ./strata:/data/strata
      # Your own llama-swap config; drop this line to use the bundled one
      # - ./config.yaml:/app/config.yaml:ro
    # Strata pins the RAM it holds the model in and uses shared memory.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: 2gb
    # Room for llama-swap to stop Strata cleanly (drain + free the GPU).
    stop_grace_period: 2m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
