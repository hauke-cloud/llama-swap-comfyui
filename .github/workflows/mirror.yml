name: Mirror upstream + ComfyUI

# Upstream (mostlygeek/llama-swap) publishes on a cron rather than on releases,
# so there is no event to subscribe to -- we poll its GHCR tag list and build
# whatever we are missing. The schedule sits a couple of hours behind upstream's
# 12:00/18:00 UTC runs so the new tags are already there when we look.
on:
  schedule:
    - cron: "30 14,20 * * *"

  workflow_dispatch:
    inputs:
      build_depth:
        description: "How many recent upstream builds to cover"
        type: string
        default: "1"
      comfyui_ref:
        description: "ComfyUI git ref to install (blank = latest release)"
        type: string
        default: ""
      force:
        description: "Rebuild tags that are already mirrored"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      comfyui_ref: ${{ steps.comfyui.outputs.ref }}
    steps:
      - uses: actions/checkout@v6

      # Resolved once here rather than per-matrix-job, so every image in a run
      # is built against the same ComfyUI release even if one is cut mid-run.
      - name: Resolve ComfyUI release
        id: comfyui
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ inputs.comfyui_ref }}
        run: |
          set -euo pipefail
          if [ -n "${PINNED}" ]; then
            ref="${PINNED}"
          else
            ref="$(gh api repos/comfyanonymous/ComfyUI/releases/latest -q .tag_name)"
          fi
          [ -n "$ref" ] && [ "$ref" != "null" ] || { echo "could not resolve ComfyUI ref" >&2; exit 1; }
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "ComfyUI ref: ${ref}" >> "$GITHUB_STEP_SUMMARY"

      - name: Plan builds
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_DEPTH: ${{ inputs.build_depth || '1' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          set -euo pipefail
          matrix="$(./scripts/plan-builds.sh)"
          count="$(jq 'length' <<<"$matrix")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          {
            echo "## Planned builds: ${count}"
            jq -r '.[] | "- `\(.tag)` (torch: \(.torch_index | split("/") | last))"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One at a time: each image is ~10 GB unpacked and concurrent runners
      # would race for the same floating tags.
      max-parallel: 1
      matrix:
        image: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      # A CUDA base (~6 GB unpacked) plus a torch layer (~4 GB) does not fit in
      # the ~14 GB a stock hosted runner leaves free.
      - name: Free up disk space
        run: |
          echo "Before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af
          echo "After cleanup:"; df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMFYUI_REF: ${{ needs.plan.outputs.comfyui_ref }}
          PUSH: "true"
          PUSH_FLOATING: ${{ matrix.image.push_floating }}
        run: ./scripts/build-image.sh "${{ matrix.image.tag }}"

      - name: Summary
        if: always()
        run: |
          echo "- \`${{ matrix.image.tag }}\` -> ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: build
    if: always() && github.repository == 'hauke-cloud/llama-swap-comfyui'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Buildx leaves untagged per-platform manifests behind on every push;
      # this action walks tagged manifest lists so it never deletes a child
      # that a live tag still references.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: llama-swap-comfyui
          delete-untagged: true
          keep-n-tagged: 40
